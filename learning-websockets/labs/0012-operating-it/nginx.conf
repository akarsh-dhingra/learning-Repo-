# Reference: an nginx load balancer in front of the three nodes (lesson 0012 version: room affinity).
# Not run by the lab (nginx isn't installed). With nginx installed: nginx -c "$PWD/nginx.conf"
# Then open http://localhost:8080/?room=demo — each new connection lands on a different node.

events {}

http {
  upstream whiteboard {
    # Option 1: least_conn — WebSockets are long-lived, so balance by OPEN connections, not round robin.
    # least_conn;
    # Option 2 (lesson 0012): ROOM AFFINITY — every client of a room lands on the same node, so chatty
    # traffic (cursors) rarely crosses the backplane. "consistent" = ketama hashing: adding/removing a
    # node only moves ~1/N of the rooms. Measured: p50 stroke delivery 6.8 s → 43 ms at 5,000 sockets.
    hash $arg_room consistent;
    server 127.0.0.1:8081;
    server 127.0.0.1:8082;
    server 127.0.0.1:8083;
  }

  # $connection_upgrade = "upgrade" for WebSocket requests, "close" otherwise
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://whiteboard;
      proxy_http_version 1.1;                       # needed for Upgrade on nginx < 1.29.7 (harmless after)
      proxy_set_header Upgrade $http_upgrade;       # hop-by-hop headers are NOT forwarded by default:
      proxy_set_header Connection $connection_upgrade; #   without these two lines the handshake fails
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 75s;                       # default 60s: no data from the server for 60s → nginx closes it
      proxy_send_timeout 75s;
    }
  }
}
